<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K's Phenomenon</title>
  <meta name="description" content="K's Phenomenon – independent app developer.">
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --link: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --text: #e6edf3;
        --muted: #9198a1;
        --border: #3d444d;
        --link: #4493f8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }
    a { color: var(--link); }
    h1 { font-size: 28px; line-height: 1.3; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 32px 0 8px; }
    p { margin: 0 0 12px; }
    .meta { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .app {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .app h3 { font-size: 16px; margin: 0 0 4px; }
    .app p { margin: 0 0 8px; }
    .links { font-size: 14px; display: flex; flex-wrap: wrap; gap: 16px; }
    footer { color: var(--muted); font-size: 13px; margin-top: 48px; }
  </style>
</head>
<body>
<main>
  <h1>K's Phenomenon</h1>
  <p class="meta">Independent app developer · 個人アプリ開発</p>

  <h2>Apps / アプリ</h2>
  <div class="app">
    <h3>Fuyomi Dojo（譜読み道場）</h3>
    <p>A score-reading practice app for piano.<br>ピアノの譜読みを練習するアプリです。</p>
    <div class="links">
      <a href="apps/fuyomi-dojo/support/">Support / サポート</a>
      <a href="apps/fuyomi-dojo/privacy/">Privacy Policy / プライバシーポリシー</a>
      <a href="apps/fuyomi-dojo/terms/">Terms / 利用規約</a>
    </div>
  </div>

  <h2>Contact / お問い合わせ</h2>
  <p><a href="mailto:ksphenomenon@gmail.com">ksphenomenon@gmail.com</a></p>

  <footer>
    © 2026 K's Phenomenon
  </footer>
</main>
</body>
</html>
